<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rootkit 交叉视图检测</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --border: #2d333f;
    --fg: #e6e9ef; --dim: #8b94a3; --accent: #4da3ff;
    --high: #ff5470; --medium: #ffb020; --low: #7a8ba0; --ok: #3fb96f; --bad: #ff5470;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { padding: 20px 28px 12px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0 0 4px; font-size: 20px; }
  header p { margin: 0; color: var(--dim); font-size: 13px; }
  .stats { display: flex; gap: 12px; padding: 16px 28px; flex-wrap: wrap; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
          padding: 10px 18px; min-width: 110px; }
  .stat .n { font-size: 24px; font-weight: 700; }
  .stat .t { color: var(--dim); font-size: 12px; }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 16px; padding: 0 28px 28px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  .panel h2 { margin: 0; padding: 12px 16px; font-size: 14px; border-bottom: 1px solid var(--border);
              display: flex; justify-content: space-between; align-items: center; }
  .panel h2 .hint { font-weight: 400; color: var(--dim); font-size: 12px; }
  .snap { padding: 10px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .snap:hover { background: var(--panel2); }
  .snap.active { background: var(--panel2); border-left: 3px solid var(--accent); }
  .snap .host { font-weight: 600; }
  .snap .meta { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .badges { margin-top: 4px; display: flex; gap: 6px; }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 10px; font-weight: 600; }
  .b-high { background: rgba(255,84,112,.15); color: var(--high); }
  .b-medium { background: rgba(255,176,32,.15); color: var(--medium); }
  .b-low { background: rgba(122,139,160,.18); color: var(--low); }
  .b-clean { background: rgba(63,185,111,.15); color: var(--ok); }
  .finding { border-bottom: 1px solid var(--border); }
  .finding summary { padding: 12px 16px; cursor: pointer; list-style: none; display: flex;
                     gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .finding summary::-webkit-details-marker { display: none; }
  .finding summary:hover { background: var(--panel2); }
  .sev { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 4px; flex: none; }
  .sev-HIGH { background: var(--high); color: #fff; }
  .sev-MEDIUM { background: var(--medium); color: #20180a; }
  .sev-LOW { background: var(--low); color: #10141b; }
  .obj { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
  .cat { color: var(--dim); font-size: 12px; }
  .fbody { padding: 0 16px 14px 16px; }
  .explain { background: var(--panel2); border-radius: 8px; padding: 10px 12px;
             margin: 4px 0 10px; font-size: 13px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  td.mono, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .seen { color: var(--ok); font-weight: 600; }
  .unseen { color: var(--bad); font-weight: 600; }
  .empty { padding: 28px 16px; color: var(--dim); text-align: center; }
  .submit { padding: 12px 16px; }
  textarea { width: 100%; min-height: 110px; background: var(--bg); color: var(--fg);
             border: 1px solid var(--border); border-radius: 8px; padding: 8px;
             font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px;
           padding: 8px 18px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  button:hover { filter: brightness(1.1); }
  #submitResult { font-size: 12px; margin-top: 6px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>🛡 Rootkit 交叉视图检测</h1>
  <p>同一类信息从多个独立途径采集并互相比对 —— 只在底层来源出现、上层看不见的条目即为疑似被隐藏对象。</p>
</header>

<div class="stats" id="stats"></div>

<main>
  <section class="panel">
    <h2>快照 <span class="hint" id="snapCount"></span></h2>
    <div id="snapList"><div class="empty">加载中…</div></div>
    <h2 style="border-top:1px solid var(--border)">手动提交快照</h2>
    <div class="submit">
      <textarea id="jsonInput" placeholder='粘贴 collect.sh 生成的快照 JSON，然后点击提交'></textarea>
      <button onclick="submitJson()">提交比对</button>
      <div id="submitResult"></div>
    </div>
  </section>

  <section class="panel">
    <h2 id="detailTitle">发现与证据 <span class="hint">点击左侧快照查看</span></h2>
    <div id="findings"><div class="empty">尚未选择快照</div></div>
  </section>
</main>

<script>
let snapshots = [];
let selectedId = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function load() {
  const [snaps, findings] = await Promise.all([
    fetch("/api/snapshots").then(r => r.json()),
    fetch("/api/findings").then(r => r.json())
  ]);
  snapshots = snaps;
  renderStats(findings);
  renderSnapList();
  if (selectedId) {
    const still = snapshots.find(s => s.id === selectedId);
    if (still) select(selectedId, true); else { selectedId = null; showEmpty(); }
  }
}

function renderStats(findings) {
  const hosts = new Set(snapshots.map(s => s.host));
  const c = sev => findings.filter(f => f.severity === sev).length;
  document.getElementById("stats").innerHTML = [
    [hosts.size, "主机"], [snapshots.length, "快照"],
    [c("HIGH"), "高危 · 疑似隐藏", "var(--high)"],
    [c("MEDIUM"), "中危", "var(--medium)"],
    [c("LOW"), "低危/噪声", "var(--low)"]
  ].map(([n, t, color]) =>
    `<div class="stat"><div class="n" style="color:${color || "var(--fg)"}">${n}</div><div class="t">${t}</div></div>`
  ).join("");
}

function renderSnapList() {
  document.getElementById("snapCount").textContent = `共 ${snapshots.length} 份，每 5 秒自动刷新`;
  const el = document.getElementById("snapList");
  if (!snapshots.length) { el.innerHTML = '<div class="empty">暂无快照，用 collector/collect.sh 采集上传</div>'; return; }
  el.innerHTML = [...snapshots].reverse().map(s => {
    const badges = s.high + s.medium + s.low === 0
      ? '<span class="badge b-clean">✓ 各视图一致</span>'
      : (s.high ? `<span class="badge b-high">HIGH ${s.high}</span>` : "")
        + (s.medium ? `<span class="badge b-medium">MED ${s.medium}</span>` : "")
        + (s.low ? `<span class="badge b-low">LOW ${s.low}</span>` : "");
    return `<div class="snap ${s.id === selectedId ? "active" : ""}" onclick="select('${s.id}')">
      <div class="host">${esc(s.host)}</div>
      <div class="meta mono">${esc(s.id)} · 采集 ${esc(s.collectedAt || "—")}</div>
      <div class="badges">${badges}</div>
    </div>`;
  }).join("");
}

async function select(id, keepScroll) {
  selectedId = id;
  renderSnapList();
  const d = await fetch("/api/snapshots/" + id).then(r => r.json());
  document.getElementById("detailTitle").innerHTML =
    `${esc(d.host)} 的发现 <span class="hint">${esc(d.id)} · 接收于 ${esc(d.receivedAt)}</span>`;
  const el = document.getElementById("findings");
  if (!d.findings.length) {
    el.innerHTML = '<div class="empty">✓ 所有视图两两一致，未发现隐藏对象</div>';
    return;
  }
  el.innerHTML = d.findings.map(f => `
    <details class="finding" ${f.severity === "HIGH" ? "open" : ""}>
      <summary>
        <span class="sev sev-${f.severity}">${f.severity}</span>
        <span class="cat">[${esc(f.categoryLabel)}]</span>
        <span class="obj">${esc(f.objectId)}</span>
        ${f.label ? `<span class="cat">${esc(f.label)}</span>` : ""}
      </summary>
      <div class="fbody">
        <div class="explain">${esc(f.explanation)}</div>
        <table>
          <tr><th>采集视图</th><th>层级</th><th>是否可见</th><th>采集侧证据</th></tr>
          ${f.evidence.map(e => `<tr>
            <td class="mono">${esc(e.view)}</td>
            <td>${e.level === 0 ? "底层" : "L" + e.level}</td>
            <td class="${e.seen ? "seen" : "unseen"}">${e.seen ? "✓ 可见" : "✗ 不可见"}</td>
            <td class="mono">${esc(e.detail || "—")}</td>
          </tr>`).join("")}
        </table>
      </div>
    </details>`).join("");
}

function showEmpty() {
  document.getElementById("detailTitle").innerHTML = '发现与证据 <span class="hint">点击左侧快照查看</span>';
  document.getElementById("findings").innerHTML = '<div class="empty">尚未选择快照</div>';
}

async function submitJson() {
  const ta = document.getElementById("jsonInput");
  const out = document.getElementById("submitResult");
  try {
    const body = JSON.parse(ta.value);
    const r = await fetch("/api/snapshots", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
    });
    const res = await r.json();
    out.textContent = r.ok
      ? `已接收 ${res.id}：共 ${res.findings} 条发现（HIGH ${res.high} / MED ${res.medium} / LOW ${res.low}）`
      : `提交失败：${JSON.stringify(res)}`;
    ta.value = "";
    await load();
    if (r.ok) select(res.id);
  } catch (e) {
    out.textContent = "JSON 解析失败：" + e.message;
  }
}

load();
setInterval(load, 5000);
</script>
</body>
</html>
